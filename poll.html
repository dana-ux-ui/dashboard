<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모바일 만족도 조사</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .survey-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    @media (min-height: 700px) {
      .survey-card {
        height: 680px;
        border-radius: 20px;
      }
    }

    /* 상단 프로그래스 바 */
    .progress-container {
      margin-bottom: 24px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background-color: #e9ecef;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      width: 33%;
      height: 100%;
      background-color: #3b82f6;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 13px;
      color: #868e96;
      text-align: right;
    }

    /* 질문 및 옵션 스타일 */
    .question-title {
      font-size: 20px;
      font-weight: 700;
      color: #212529;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      min-height: 54px;
      padding: 14px 16px;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      color: #495057;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.selected {
      background-color: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
      font-weight: 600;
    }

    /* 하단 버튼 영역 */
    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: auto;
      padding-top: 20px;
    }

    .btn {
      flex: 1;
      height: 52px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .btn-secondary {
      background-color: #f1f3f5;
      color: #495057;
    }

    .btn-primary {
      background-color: #3b82f6;
      color: #ffffff;
    }

    .btn-primary:disabled {
      background-color: #ced4da;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="survey-card">
    <div>
      <!-- 프로그래스 바 -->
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">1 / 3</div>
      </div>

      <!-- 질문 및 선택지 -->
      <h2 class="question-title" id="questionTitle">오늘 서비스 이용 경험은 어떠셨나요?</h2>
      
      <div class="options-group" id="optionsGroup">
        <button class="option-btn" onclick="selectOption(this)">😍 매우 만족스럽다</button>
        <button class="option-btn" onclick="selectOption(this)">🙂 만족스럽다</button>
        <button class="option-btn" onclick="selectOption(this)">😐 보통이다</button>
        <button class="option-btn" onclick="selectOption(this)">🙁 불만족스럽다</button>
      </div>
    </div>

    <!-- 하단 네비게이션 -->
    <div class="nav-buttons">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevStep()" disabled>이전</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextStep()" disabled>다음</button>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 3;

    function selectOption(element) {
      const options = document.querySelectorAll('.option-btn');
      options.forEach(opt => opt.classList.remove('selected'));
      element.classList.add('selected');
      
      document.getElementById('nextBtn').disabled = false;
    }

    function nextStep() {
      if (currentStep < totalSteps) {
        currentStep++;
        updateUI();
      } else {
        alert('조사가 완료되었습니다. 참여해 주셔서 감사합니다!');
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        updateUI();
      }
    }

    function updateUI() {
      // 프로그래스 바 및 텍스트 업데이트
      document.getElementById('progressFill').style.width = `${(currentStep / totalSteps) * 100}%`;
      document.getElementById('progressText').innerText = `${currentStep} / ${totalSteps}`;
      
      // 버튼 상태 변경
      document.getElementById('prevBtn').disabled = currentStep === 1;
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('nextBtn').innerText = currentStep === totalSteps ? '제출하기' : '다음';

      // 다음 질문 내용 데이터 (예시)
      if (currentStep === 2) {
        document.getElementById('questionTitle').innerText = '어떤 점이 가장 마음에 드셨나요?';
        document.getElementById('optionsGroup').innerHTML = `
          <button class="option-btn" onclick="selectOption(this)">⚡ 빠른 처리 속도</button>
          <button class="option-btn" onclick="selectOption(this)">🎨 깔끔한 디자인</button>
          <button class="option-btn" onclick="selectOption(this)">💡 편리한 기능</button>
        `;
      } else if (currentStep === 3) {
        document.getElementById('questionTitle').innerText = '향후 다시 이용할 의향이 있으신가요?';
        document.getElementById('optionsGroup').innerHTML = `
          <button class="option-btn" onclick="selectOption(this)">👍 적극 이용하겠다</button>
          <button class="option-btn" onclick="selectOption(this)">👌 이용하겠다</button>
          <button class="option-btn" onclick="selectOption(this)">👎 이용하지 않겠다</button>
        `;
      }
    }
  </script>
</body>
</html>
