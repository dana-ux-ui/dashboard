<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-Depth 사이드바 대시보드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      min-height: 100vh;
    }

    /* ==================== 사이드바 ==================== */
    .sidebar {
      width: 260px;
      background-color: #0f172a;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #f8fafc;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    /* 공통 메뉴 리스트 스타일 */
    .menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    /* 토글 화살표 */
    .arrow {
      margin-left: auto;
      font-size: 0.75rem;
      transition: transform 0.2s ease;
    }

    .has-sub.open > .menu-btn > .arrow {
      transform: rotate(90deg);
    }

    /* Depth 1 */
    .depth-1 > li > .menu-btn,
    .depth-1 > li > a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: #94a3b8;
      text-decoration: none;
      width: 100%;
      background: none;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }

    .depth-1 > li > .menu-btn:hover,
    .depth-1 > li > a:hover,
    .depth-1 > li.active > a {
      background-color: #1e293b;
      color: #f8fafc;
    }

    .menu-icon {
      font-size: 1.1rem;
      min-width: 20px;
      text-align: center;
    }

    /* 하위 메뉴 숨김 기본 설정 */
    .sub-menu {
      display: none;
      background-color: #020617;
      list-style: none;
      padding: 0;
    }

    /* Depth 2 */
    .depth-2 > li > .menu-btn,
    .depth-2 > li > a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px 10px 48px; /* 들여쓰기 */
      color: #64748b;
      text-decoration: none;
      width: 100%;
      background: none;
      border: none;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .depth-2 > li > .menu-btn:hover,
    .depth-2 > li > a:hover {
      color: #f8fafc;
    }

    /* Depth 3 */
    .depth-3 {
      background-color: #000000;
    }

    .depth-3 > li > a {
      display: block;
      padding: 8px 20px 8px 64px; /* 추가 들여쓰기 */
      color: #475569;
      text-decoration: none;
      font-size: 0.82rem;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .depth-3 > li > a:hover,
    .depth-3 > li.active > a {
      color: #38bdf8; /* 활성화 색상 포인트 */
    }

    /* ==================== 사이드바 접힘 (Collapsed) 상태 ==================== */
    .sidebar.collapsed {
      width: 64px;
    }

    .sidebar.collapsed .logo-text,
    .sidebar.collapsed .menu-text,
    .sidebar.collapsed .arrow {
      display: none;
    }

    /* 접혔을 때 호버 팝업 메뉴 스타일 */
    .sidebar.collapsed .depth-1 > li {
      position: relative;
    }

    .sidebar.collapsed .depth-1 > li.has-sub:hover > .sub-menu {
      display: block !important;
      position: absolute;
      left: 64px;
      top: 0;
      width: 200px;
      background-color: #0f172a;
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.3);
      border-radius: 0 6px 6px 0;
    }

    .sidebar.collapsed .depth-2 > li > .menu-btn,
    .sidebar.collapsed .depth-2 > li > a {
      padding-left: 20px;
    }

    .sidebar.collapsed .depth-3 > li > a {
      padding-left: 32px;
    }

    .sidebar.collapsed .depth-1 > li.has-sub:hover > .sub-menu .arrow,
    .sidebar.collapsed .depth-1 > li.has-sub:hover > .sub-menu .menu-text {
      display: inline-block;
    }

    /* ==================== 메인 영역 ==================== */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      background-color: #fff;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #e2e8f0;
    }

    .toggle-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #64748b;
    }

    .content {
      padding: 25px;
    }
  </style>
</head>
<body>

  <!-- 사이드바 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="menu-icon">🚀</span>
      <span class="logo-text">System Admin</span>
    </div>

    <nav class="sidebar-nav">
      <!-- Depth 1 시작 -->
      <ul class="menu-list depth-1">
        
        <!-- 단일 메뉴 예시 -->
        <li>
          <a href="#">
            <span class="menu-icon">📊</span>
            <span class="menu-text">대시보드</span>
          </a>
        </li>

        <!-- 3-Depth 메뉴 예시 -->
        <li class="has-sub">
          <button class="menu-btn">
            <span class="menu-icon">👥</span>
            <span class="menu-text">사용자 관리</span>
            <span class="arrow">▶</span>
          </button>
          
          <!-- Depth 2 시작 -->
          <ul class="sub-menu depth-2">
            
            <li class="has-sub">
              <button class="menu-btn">
                <span class="menu-text">회원 목록</span>
                <span class="arrow">▶</span>
              </button>
              
              <!-- Depth 3 시작 -->
              <ul class="sub-menu depth-3">
                <li><a href="#">전체 회원 조회</a></li>
                <li><a href="#">탈퇴 요청 목록</a></li>
                <li><a href="#">휴면 계정 관리</a></li>
              </ul>
              <!-- Depth 3 끝 -->
            </li>

            <li class="has-sub">
              <button class="menu-btn">
                <span class="menu-text">권한 및 그룹</span>
                <span class="arrow">▶</span>
              </button>
              <ul class="sub-menu depth-3">
                <li><a href="#">관리자 권한 설정</a></li>
                <li><a href="#">접근 그룹 생성</a></li>
              </ul>
            </li>

          </ul>
          <!-- Depth 2 끝 -->
        </li>

        <!-- 2-Depth 메뉴 예시 -->
        <li class="has-sub">
          <button class="menu-btn">
            <span class="menu-icon">⚙️</span>
            <span class="menu-text">시스템 설정</span>
            <span class="arrow">▶</span>
          </button>
          <ul class="sub-menu depth-2">
            <li><a href="#">기본 환경 설정</a></li>
            <li><a href="#">보안 및 로그</a></li>
          </ul>
        </li>

      </ul>
    </nav>
  </aside>

  <!-- 메인 콘텐츠 영역 -->
  <div class="main-container">
    <header class="header">
      <button class="toggle-btn" id="toggleSidebar">☰</button>
      <h2>3-Depth 아코디언 대시보드</h2>
    </header>

    <main class="content">
      <p>좌측 메뉴의 <code>사용자 관리</code> > <code>회원 목록</code>을 클릭하여 3단계 Depth 메뉴를 확인하세요.</p>
    </main>
  </div>

  <!-- 스크립트 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('toggleSidebar');

      // 1. 아코디언 메뉴 동작 (하위 메뉴 토글)
      const menuBtns = document.querySelectorAll('.has-sub > .menu-btn');

      menuBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();

          // 사이드바가 접혀있는 경우 클릭 토글을 방지 (호버 모드로 동작)
          if (sidebar.classList.contains('collapsed')) return;

          const parentLi = btn.parentElement;
          const subMenu = parentLi.querySelector(':scope > .sub-menu');

          // 현재 메뉴 닫기/열기 상태 변경
          if (parentLi.classList.contains('open')) {
            parentLi.classList.remove('open');
            slideUp(subMenu);
          } else {
            // 같은 Depth 상위 요소의 다른 열린 메뉴 닫기 (선택사항: 단일 아코디언)
            const siblings = parentLi.parentElement.children;
            Array.from(siblings).forEach(sibling => {
              if (sibling !== parentLi && sibling.classList.contains('open')) {
                sibling.classList.remove('open');
                const siblingSubMenu = sibling.querySelector(':scope > .sub-menu');
                if (siblingSubMenu) slideUp(siblingSubMenu);
              }
            });

            parentLi.classList.add('open');
            slideDown(subMenu);
          }
        });
      });

      // 2. 데스크톱 사이드바 접기/펼치기 토글
      toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');

        // 접힐 때 모든 열려있던 아코디언 정리
        if (sidebar.classList.contains('collapsed')) {
          document.querySelectorAll('.has-sub.open').forEach(item => {
            item.classList.remove('open');
            const sub = item.querySelector(':scope > .sub-menu');
            if (sub) sub.style.display = 'none';
          });
        }
      });

      // 3. 슬라이드 애니메이션 함수 (순수 JS 구현)
      function slideDown(element) {
        element.style.display = 'block';
        const height = element.scrollHeight;
        element.style.overflow = 'hidden';
        element.style.height = '0px';
        element.style.transition = 'height 0.25s ease';

        requestAnimationFrame(() => {
          element.style.height = height + 'px';
        });

        setTimeout(() => {
          element.style.height = '';
          element.style.overflow = '';
          element.style.transition = '';
        }, 250);
      }

      function slideUp(element) {
        element.style.height = element.scrollHeight + 'px';
        element.style.overflow = 'hidden';
        element.style.transition = 'height 0.25s ease';

        requestAnimationFrame(() => {
          element.style.height = '0px';
        });

        setTimeout(() => {
          element.style.display = 'none';
          element.style.height = '';
          element.style.overflow = '';
          element.style.transition = '';
        }, 250);
      }
    });
  </script>
</body>
</html>
