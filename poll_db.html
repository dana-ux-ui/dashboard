<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모바일 만족도 조사</title>
  <!-- Supabase 연동 라이브러리 불러오기 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .survey-card { width: 100%; max-width: 420px; background: #ffffff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 24px 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
    @media (min-height: 700px) { .survey-card { height: 680px; border-radius: 20px; } }
    .progress-container { margin-bottom: 24px; }
    .progress-bar { width: 100%; height: 6px; background-color: #e9ecef; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
    .progress-fill { width: 33%; height: 100%; background-color: #3b82f6; transition: width 0.3s ease; }
    .progress-text { font-size: 13px; color: #868e96; text-align: right; }
    .question-title { font-size: 20px; font-weight: 700; color: #212529; line-height: 1.4; margin-bottom: 24px; }
    .options-group { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { width: 100%; min-height: 54px; padding: 14px 16px; background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 12px; font-size: 16px; font-weight: 500; color: #495057; text-align: left; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 12px; }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.selected { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; font-weight: 600; }
    .nav-buttons { display: flex; gap: 12px; margin-top: auto; padding-top: 20px; }
    .btn { flex: 1; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; }
    .btn-secondary { background-color: #f1f3f5; color: #495057; }
    .btn-primary { background-color: #3b82f6; color: #ffffff; }
    .btn-primary:disabled { background-color: #ced4da; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="survey-card">
    <div>
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">1 / 3</div>
      </div>

      <h2 class="question-title" id="questionTitle">오늘 서비스 이용 경험은 어떠셨나요?</h2>
      
      <div class="options-group" id="optionsGroup">
        <button class="option-btn" onclick="selectOption(this, '매우 만족')">😍 매우 만족스럽다</button>
        <button class="option-btn" onclick="selectOption(this, '만족')">🙂 만족스럽다</button>
        <button class="option-btn" onclick="selectOption(this, '보통')">😐 보통이다</button>
        <button class="option-btn" onclick="selectOption(this, '불만족')">🙁 불만족스럽다</button>
      </div>
    </div>

    <div class="nav-buttons">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevStep()" disabled>이전</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextStep()" disabled>다음</button>
    </div>
  </div>

<script>
  // 1. Supabase 접속 정보 (본인의 URL과 ANON_KEY로 수정하세요)
  const SUPABASE_URL = "여기에_SUPABASE_URL_입력";
  const SUPABASE_KEY = "여기에_SUPABASE_ANON_KEY_입력";
  
  // 2. Supabase 클라이언트 초기화 (딱 한 번만 선언!)
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentStep = 1;
  const totalSteps = 3;
  
  const answers = {
    q1: "",
    q2: "",
    q3: ""
  };

  // 항목 선택 함수
  function selectOption(evt, textValue) {
    const targetBtn = evt.currentTarget;
    const options = document.querySelectorAll('.option-btn');
    options.forEach(opt => opt.classList.remove('selected'));
    
    targetBtn.classList.add('selected');
    answers[`q${currentStep}`] = textValue;
    document.getElementById('nextBtn').disabled = false;
  }

  // 다음 / 제출 버튼
  async function nextStep() {
    if (currentStep < totalSteps) {
      currentStep++;
      updateUI();
    } else {
      document.getElementById('nextBtn').innerText = '저장 중...';
      document.getElementById('nextBtn').disabled = true;

      // Supabase DB 저장
      const { data, error } = await supabaseClient
        .from('surveys')
        .insert([
          { q1: answers.q1, q2: answers.q2, q3: answers.q3 }
        ]);

      if (error) {
        console.error("저장 실패:", error);
        alert('저장 중 오류가 발생했습니다. 다시 시도해 주세요.');
        document.getElementById('nextBtn').innerText = '제출하기';
        document.getElementById('nextBtn').disabled = false;
      } else {
        alert('설문이 성공적으로 제출되었습니다. 감사합니다!');
        location.reload();
      }
    }
  }

  // 이전 버튼
  function prevStep() {
    if (currentStep > 1) {
      currentStep--;
      updateUI();
    }
  }

  // UI 업데이트
  function updateUI() {
    document.getElementById('progressFill').style.width = `${(currentStep / totalSteps) * 100}%`;
    document.getElementById('progressText').innerText = `${currentStep} / ${totalSteps}`;
    
    document.getElementById('prevBtn').disabled = currentStep === 1;
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('nextBtn').innerText = currentStep === totalSteps ? '제출하기' : '다음';

    if (currentStep === 2) {
      document.getElementById('questionTitle').innerText = '어떤 점이 가장 마음에 드셨나요?';
      document.getElementById('optionsGroup').innerHTML = `
        <button class="option-btn" onclick="selectOption(event, '빠른 처리')">⚡ 빠른 처리 속도</button>
        <button class="option-btn" onclick="selectOption(event, '디자인')">🎨 깔끔한 디자인</button>
        <button class="option-btn" onclick="selectOption(event, '편리한 기능')">💡 편리한 기능</button>
      `;
    } else if (currentStep === 3) {
      document.getElementById('questionTitle').innerText = '향후 다시 이용할 의향이 있으신가요?';
      document.getElementById('optionsGroup').innerHTML = `
        <button class="option-btn" onclick="selectOption(event, '적극 이용')">👍 적극 이용하겠다</button>
        <button class="option-btn" onclick="selectOption(event, '이용')">👌 이용하겠다</button>
        <button class="option-btn" onclick="selectOption(event, '이용 안함')">👎 이용하지 않겠다</button>
      `;
    }
  }
</script>
</body>
</html>
